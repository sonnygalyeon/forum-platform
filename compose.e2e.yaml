
services:
  db:
    environment:
      POSTGRES_DB: forum_e2e
    volumes:
      - postgres_e2e_data:/var/lib/postgresql

  redis:
    volumes:
      - redis_e2e_data:/data

  minio:
    volumes:
      - minio_e2e_data:/data

  migrate:
    environment:
      POSTGRES_DB: forum_e2e
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,api
      DRF_THROTTLE_AUTH: 1000/min
      METRICS_ENABLED: "0"

  api:
    environment:
      POSTGRES_DB: forum_e2e
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,api
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      DRF_THROTTLE_AUTH: 1000/min
      DRF_THROTTLE_ANON: 5000/min
      DRF_THROTTLE_USER: 5000/min
      METRICS_ENABLED: "0"

  frontend:
    environment:
      BACKEND_API_URL: http://api:8000/api/v1
      BACKEND_FETCH_TIMEOUT_MS: "10000"
      BACKEND_DISABLE_KEEPALIVE: "0"

volumes:
  postgres_e2e_data:
  redis_e2e_data:
  minio_e2e_data:
