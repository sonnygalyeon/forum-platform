[project]
name = "forum-platform"
version = "1.0.0"
description = "API-first forum platform built with Django REST Framework"
requires-python = ">=3.13,<3.14"
dependencies = [
    "Django>=5.2,<5.3",
    "djangorestframework>=3.16,<4",
    "djangorestframework-simplejwt>=5.5,<6",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1.1,<2",
    "boto3>=1.40,<2",
    "celery[redis]>=5.6,<5.7",
    "drf-spectacular[sidecar]>=0.30,<0.31",
    "django-cors-headers>=4.9,<5",
    "gunicorn>=23,<24",
    "whitenoise>=6.9,<7",
    "channels>=4.2,<5",
    "channels-redis>=4.2,<5",
    "daphne>=4.2,<5",
    "prometheus-client>=0.22,<1",
    "sentry-sdk[django]>=2.35,<3",
    "sqlparse>=0.6,<0.7",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "pytest-django>=4.11,<5",
    "pytest-cov>=6.2,<7",
    "pytest-asyncio>=1.1,<2",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
testpaths = ["tests", "apps"]
python_files = ["test_*.py", "tests.py"]
addopts = "-ra --strict-markers"
markers = [
    "integration: tests crossing multiple Night Iris subsystems",
    "websocket: Channels/WebSocket behavior",
    "query_budget: database query-count regression guard",
]


[tool.uv]
package = false
