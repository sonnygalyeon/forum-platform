[project]
name = "forum-platform"
version = "0.6.1"
description = "API-first forum platform built with Django REST Framework"
requires-python = ">=3.13,<3.14"
dependencies = [
    "Django>=5.2,<5.3",
    "djangorestframework>=3.16,<4",
    "djangorestframework-simplejwt>=5.5,<6",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1.1,<2",
    "boto3>=1.40,<2",
]

[tool.uv]
package = false
