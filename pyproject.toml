[project]
name = "forum-platform"
version = "0.8.10"
description = "API-first forum platform built with Django REST Framework"
requires-python = ">=3.13,<3.14"
dependencies = [
    "Django>=5.2,<5.3",
    "djangorestframework>=3.16,<4",
    "djangorestframework-simplejwt>=5.5,<6",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1.1,<2",
    "boto3>=1.40,<2",
    "celery[redis]>=5.6,<5.7",
    "drf-spectacular[sidecar]>=0.30,<0.31",
    "django-cors-headers>=4.9,<5",
    "gunicorn>=23,<24",
    "whitenoise>=6.9,<7",
    "channels>=4.2,<5",
    "channels-redis>=4.2,<5",
    "daphne>=4.2,<5",
]

[tool.uv]
package = false
