x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-app-env: &app-env
  APP_VERSION: ${APP_VERSION:-}
  BUILD_SHA: ${BUILD_SHA:-unknown}
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
  JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
  DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-0}
  DJANGO_SESSION_COOKIE_SECURE: ${DJANGO_SESSION_COOKIE_SECURE:-1}
  DJANGO_CSRF_COOKIE_SECURE: ${DJANGO_CSRF_COOKIE_SECURE:-1}
  DJANGO_HSTS_SECONDS: ${DJANGO_HSTS_SECONDS:-31536000}
  DJANGO_HSTS_INCLUDE_SUBDOMAINS: ${DJANGO_HSTS_INCLUDE_SUBDOMAINS:-1}
  DJANGO_HSTS_PRELOAD: ${DJANGO_HSTS_PRELOAD:-0}
  POSTGRES_CONN_MAX_AGE: ${POSTGRES_CONN_MAX_AGE:-60}
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_HOST: ${POSTGRES_HOST:-db}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  REDIS_CACHE_URL: ${REDIS_CACHE_URL}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL}
  CHANNEL_REDIS_URL: ${CHANNEL_REDIS_URL}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  S3_BUCKET: ${S3_BUCKET}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_INTERNAL_ENDPOINT: ${S3_INTERNAL_ENDPOINT}
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
  S3_PRESIGNED_EXPIRES: ${S3_PRESIGNED_EXPIRES:-900}
  S3_MAX_FILE_SIZE: ${S3_MAX_FILE_SIZE:-30000000000}
  S3_MULTIPART_PART_SIZE: ${S3_MULTIPART_PART_SIZE:-67108864}
  S3_CORS_ALLOWED_ORIGINS: ${S3_CORS_ALLOWED_ORIGINS}
  S3_CONFIGURE_BUCKET_CORS: ${S3_CONFIGURE_BUCKET_CORS:-0}
  MEDIA_REQUIRE_SCAN: ${MEDIA_REQUIRE_SCAN:-0}
  MEDIA_SCANNER_BACKEND: ${MEDIA_SCANNER_BACKEND:-clamav}
  MEDIA_SCANNER_HOST: ${MEDIA_SCANNER_HOST:-}
  MEDIA_SCANNER_PORT: ${MEDIA_SCANNER_PORT:-3310}
  MEDIA_SCANNER_TIMEOUT_SECONDS: ${MEDIA_SCANNER_TIMEOUT_SECONDS:-120}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
  API_DOCS_ENABLED: ${API_DOCS_ENABLED:-0}
  READINESS_CHECK_S3: ${READINESS_CHECK_S3:-1}
  DRF_THROTTLE_ANON: ${DRF_THROTTLE_ANON:-120/min}
  DRF_THROTTLE_USER: ${DRF_THROTTLE_USER:-600/min}
  DRF_THROTTLE_AUTH: ${DRF_THROTTLE_AUTH:-10/min}
  DRF_THROTTLE_UPLOADS: ${DRF_THROTTLE_UPLOADS:-120/min}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: ${LOG_FORMAT:-json}
  SLOW_QUERY_MS: ${SLOW_QUERY_MS:-250}
  METRICS_ENABLED: ${METRICS_ENABLED:-1}
  METRICS_TOKEN: ${METRICS_TOKEN}
  CELERY_HEARTBEAT_STALE_SECONDS: ${CELERY_HEARTBEAT_STALE_SECONDS:-90}
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
  SENTRY_RELEASE: ${SENTRY_RELEASE:-night-iris@1.0.0}
  SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.05}

services:
  db:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging

  minio:
    image: quay.io/minio/minio
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_API_CORS_ALLOW_ORIGIN: ${S3_CORS_ALLOWED_ORIGINS}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging

  minio-init:
    image: minio/mc
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./deploy/minio/init.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "/init.sh"]
    restart: "no"
    logging: *default-logging

  migrate:
    image: night-iris-backend:${APP_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile.prod
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    command:
      - /bin/sh
      - -c
      - >-
        python manage.py migrate --noinput &&
        python manage.py ensure_object_storage
    restart: "no"
    logging: *default-logging

  api:
    image: night-iris-backend:${APP_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    command:
      - /bin/sh
      - -c
      - >-
        python manage.py collectstatic --noinput &&
        exec daphne -b 0.0.0.0 -p 8000 --proxy-headers config.asgi:application
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/api/v1/live/', timeout=3).read()
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *default-logging

  worker:
    image: night-iris-backend:${APP_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO", "--concurrency=2"]
    logging: *default-logging

  beat:
    image: night-iris-backend:${APP_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: ["celery", "-A", "config", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    logging: *default-logging

  frontend:
    image: night-iris-frontend:${APP_IMAGE_TAG:-local}
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      BACKEND_API_URL: ${BACKEND_API_URL:-http://api:8000/api/v1}
      BACKEND_FETCH_TIMEOUT_MS: ${BACKEND_FETCH_TIMEOUT_MS:-10000}
      BACKEND_DISABLE_KEEPALIVE: ${BACKEND_DISABLE_KEEPALIVE:-0}
      NODE_ENV: production
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *default-logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      MEDIA_DOMAIN: ${MEDIA_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
      api:
        condition: service_healthy
      minio:
        condition: service_healthy
    logging: *default-logging

  minio-client:
    image: minio/mc
    profiles: ["tools"]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
    entrypoint: ["/bin/sh", "-c"]
    command: ["sleep infinity"]
    volumes:
      - ./backups/minio:/backup
    depends_on:
      minio:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:
