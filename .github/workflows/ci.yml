name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  security-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/security_audit_repo.sh
      - run: ./scripts/version_check.py

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Audit Python production dependencies
        run: |
          uv export --frozen --no-dev --no-hashes --format requirements-txt > /tmp/night-iris-requirements.txt
          uvx pip-audit --strict -r /tmp/night-iris-requirements.txt
      - name: Audit frontend production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: forum
          POSTGRES_USER: forum
          POSTGRES_PASSWORD: forum
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forum -d forum"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379

    env:
      DJANGO_SECRET_KEY: ci-secret-key-that-is-not-used-outside-ci
      JWT_SIGNING_KEY: ci-jwt-key-that-is-not-used-outside-ci
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: localhost,testserver,127.0.0.1
      POSTGRES_DB: forum
      POSTGRES_USER: forum
      POSTGRES_PASSWORD: forum
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      REDIS_CACHE_URL: redis://127.0.0.1:6379/1
      CHANNEL_REDIS_URL: redis://127.0.0.1:6379/2
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      S3_ACCESS_KEY: ci-access
      S3_SECRET_KEY: ci-secret
      S3_BUCKET: forum-media
      S3_INTERNAL_ENDPOINT: http://127.0.0.1:9000
      S3_PUBLIC_ENDPOINT: http://127.0.0.1:9000
      READINESS_CHECK_S3: "0"
      API_DOCS_ENABLED: "1"
      METRICS_ENABLED: "1"
      METRICS_TOKEN: ci-metrics-token
      SLOW_QUERY_MS: "0"

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --frozen --group dev
      - run: ./scripts/version_check.py
      - run: uv run python manage.py check
      - run: uv run python manage.py makemigrations --check --dry-run
      - name: Generate current OpenAPI contract
        run: uv run python manage.py spectacular --file /tmp/forum-openapi.yml --validate --fail-on-warn
      - name: Verify backwards compatibility with 0.9 beta public API
        run: |
          BASE_SHA=0003228145934f837d38f3610db730bec69a5c18
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git worktree add --detach /tmp/night-iris-api-beta "$BASE_SHA"
          (
            cd /tmp/night-iris-api-beta
            "$GITHUB_WORKSPACE/.venv/bin/python" manage.py spectacular \
              --file /tmp/forum-openapi-beta.yml --validate --fail-on-warn
          )
          uv run python scripts/check_openapi_compat.py \
            /tmp/forum-openapi-beta.yml /tmp/forum-openapi.yml
      - run: uv run pytest --cov=apps --cov=config --cov-report=term-missing --cov-fail-under=25

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: forum
          POSTGRES_USER: forum
          POSTGRES_PASSWORD: forum
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forum -d forum"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379

    env:
      DJANGO_SECRET_KEY: e2e-secret-key
      JWT_SIGNING_KEY: e2e-jwt-key
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: localhost,testserver,127.0.0.1
      POSTGRES_DB: forum
      POSTGRES_USER: forum
      POSTGRES_PASSWORD: forum
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      REDIS_CACHE_URL: redis://127.0.0.1:6379/1
      CHANNEL_REDIS_URL: redis://127.0.0.1:6379/2
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      S3_ACCESS_KEY: e2e-access
      S3_SECRET_KEY: e2e-secret
      S3_BUCKET: forum-media
      S3_INTERNAL_ENDPOINT: http://127.0.0.1:9000
      S3_PUBLIC_ENDPOINT: http://127.0.0.1:9000
      READINESS_CHECK_S3: "0"
      API_DOCS_ENABLED: "0"
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:3000
      METRICS_ENABLED: "0"
      DRF_THROTTLE_AUTH: 1000/min

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen --no-dev
      - run: uv run python manage.py migrate --noinput
      - name: Start Django ASGI
        run: |
          uv run daphne -b 127.0.0.1 -p 8000 config.asgi:application >/tmp/night-iris-backend.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/v1/live/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/night-iris-backend.log
          exit 1
      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Start Next.js
        working-directory: frontend
        env:
          BACKEND_API_URL: http://127.0.0.1:8000/api/v1
          BACKEND_FETCH_TIMEOUT_MS: "10000"
          BACKEND_DISABLE_KEEPALIVE: "1"
        run: |
          npm run dev >/tmp/night-iris-frontend.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/night-iris-frontend.log
          exit 1
      - name: Playwright Chromium
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          PLAYWRIGHT_MANAGE_WEBSERVER: "0"
        run: npx playwright test --project=chromium

  production-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.prod.example .env.prod
      - run: docker compose --env-file .env.prod -f compose.prod.yaml config >/dev/null
      - name: Validate Caddy production configuration
        run: >-
          docker run --rm
          -e APP_DOMAIN=forum.example.com
          -e ACME_EMAIL=admin@example.com
          -v "$PWD/deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2-alpine
          caddy validate --config /etc/caddy/Caddyfile

  mac-server:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Start the isolated production-mode Mac demo without public tunnels
        run: |
          sh -n scripts/mac_server.sh
          sh scripts/mac_server.sh start --domains forum.example.test files.example.test
      - name: Check actual proxy, authentication, WebSocket and storage routes
        run: sh scripts/mac_server.sh compose exec -T api python scripts/mac_smoke.py
      - name: Verify private port bindings and persistent credentials
        run: |
          sh scripts/mac_server.sh compose config --format json > /tmp/mac-compose.json
          python - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path('/tmp/mac-compose.json').read_text())
          for name, service in config['services'].items():
              ports = service.get('ports', [])
              if name == 'gateway':
                  assert len(ports) == 2
                  assert all(p['host_ip'] == '127.0.0.1' for p in ports)
              else:
                  assert not ports, name
          env = Path('.env.mac')
          assert env.stat().st_mode & 0o777 == 0o600
          PY
          cp .env.mac /tmp/mac-env-before
          sh scripts/mac_server.sh init
          cmp .env.mac /tmp/mac-env-before
      - name: Diagnostics
        if: failure()
        run: sh scripts/mac_server.sh logs
      - name: Stop demo without deleting data
        if: always()
        run: sh scripts/mac_server.sh stop

  development-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and start the documented local stack
        run: |
          sh -n scripts/dev_up.sh
          sh scripts/dev_up.sh
          curl -fsS http://127.0.0.1:3000/ >/dev/null
          curl -fsS http://127.0.0.1:8000/api/v1/ready/
      - name: Round-trip object storage on the isolated local stack
        run: |
          docker compose exec -T api python - <<'PY'
          import os
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from scripts.object_storage_transfer import backup, client, restore, validate_backup

          s3 = client()
          bucket = os.environ["S3_BUCKET"]
          expected = {"ci-backup/a.txt": b"alpha", "ci-backup/nested/b.txt": b"beta"}
          for key, body in expected.items():
              s3.put_object(Bucket=bucket, Key=key, Body=body)
          with TemporaryDirectory() as directory:
              snapshot = Path(directory) / "snapshot"
              backup(snapshot)
              assert len(validate_backup(snapshot)) == len(expected)
              s3.delete_object(Bucket=bucket, Key="ci-backup/a.txt")
              s3.put_object(Bucket=bucket, Key="ci-backup/extra.txt", Body=b"extra")
              restore(snapshot, remove_extra=True)
              actual = s3.list_objects_v2(Bucket=bucket).get("Contents", [])
              assert {item["Key"] for item in actual} == set(expected)
              for key, body in expected.items():
                  assert s3.get_object(Bucket=bucket, Key=key)["Body"].read() == body
          print("Object storage backup/verify/restore round trip passed.")
          PY
      - name: Show development service logs on failure
        if: failure()
        run: docker compose logs --tail=100
      - name: Stop isolated runner stack
        if: always()
        run: docker compose down --volumes --remove-orphans
