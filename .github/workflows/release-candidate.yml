name: Release Candidate Gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rc-artifact-gate:
    runs-on: ubuntu-latest
    env:
      APP_IMAGE_TAG: rc-${{ github.sha }}
      BUILD_SHA: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve release metadata
        id: release
        run: |
          VERSION="$(cat VERSION)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "SENTRY_RELEASE=night-iris@$VERSION" >> "$GITHUB_ENV"
          ./scripts/version_check.py

      - name: Validate shell entrypoints
        run: |
          sh -n scripts/backup_all.sh
          sh -n scripts/backup_postgres.sh
          sh -n scripts/backup_minio.sh
          sh -n scripts/verify_backup.sh
          sh -n scripts/restore_postgres.sh
          sh -n scripts/restore_minio.sh
          sh -n scripts/restore_all.sh
          sh -n scripts/deploy_prod.sh
          sh -n scripts/rollback_prod.sh
          sh -n scripts/prod_config_check.sh
          sh -n scripts/prod_smoke.sh
          sh -n scripts/release_manifest.sh

      - name: Validate production Compose
        run: |
          cp .env.prod.example .env.prod
          docker compose --env-file .env.prod -f compose.prod.yaml config >/dev/null

      - name: Validate Caddy
        run: >-
          docker run --rm
          -e APP_DOMAIN=forum.example.com
          -e MEDIA_DOMAIN=media.forum.example.com
          -e ACME_EMAIL=admin@example.com
          -v "$PWD/deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2-alpine
          caddy validate --config /etc/caddy/Caddyfile

      - name: Build tagged production images
        run: >-
          docker compose --env-file .env.prod -f compose.prod.yaml
          build api frontend

      - name: Build immutable release bundle
        run: |
          OUT=/tmp/night-iris-release
          mkdir -p "$OUT"
          ./scripts/release_manifest.sh "$OUT/release-manifest.txt"
          ARCHIVE_NAME="night-iris-${APP_VERSION}.zip"
          ARCHIVE="$OUT/$ARCHIVE_NAME"
          git archive \
            --format=zip \
            --prefix="night-iris-${APP_VERSION}/" \
            --output="$ARCHIVE" \
            HEAD
          (
            cd "$OUT"
            sha256sum "$ARCHIVE_NAME" > "$ARCHIVE_NAME.sha256"
          )
          {
            echo "source_archive=$ARCHIVE_NAME"
            echo "source_archive_sha256=$(sha256sum "$ARCHIVE" | awk '{print $1}')"
          } >> "$OUT/release-manifest.txt"
          cat "$OUT/release-manifest.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: night-iris-${{ steps.release.outputs.version }}-${{ github.sha }}
          path: /tmp/night-iris-release/
          if-no-files-found: error
          retention-days: 30
