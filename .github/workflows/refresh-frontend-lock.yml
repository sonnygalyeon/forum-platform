name: Refresh frontend release lock

on:
  push:
    branches: [ver1.0-ga]

permissions:
  contents: write

jobs:
  refresh-frontend-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ver1.0-ga
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Synchronize package-lock metadata
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit synchronized lock
        run: |
          if git diff --quiet -- frontend/package-lock.json; then
            echo "frontend/package-lock.json is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "release: synchronize frontend lock metadata"
          git push origin HEAD:ver1.0-ga
